name: Pip Surgeon Telegram Automation

on:
  schedule:
    # All times UTC. Kenya (EAT) = UTC+3 — adjust to shift posting times.
    - cron: '0 5 * * *'    # 05:00 UTC / 08:00 EAT — Today's USD calendar preview (always fires)
    - cron: '0 8 * * *'    # 08:00 UTC / 11:00 EAT — Educational "Did You Know" post + quiz poll
    - cron: '0 12 * * *'   # 12:00 UTC / 15:00 EAT — Market Pulse brief
    - cron: '0 6 * * 1'    # 06:00 UTC Monday only / 09:00 EAT — Weekly sentiment poll
    - cron: '0 15 * * 5'   # 15:00 UTC Friday only / 18:00 EAT — Week in Review digest
    - cron: '*/15 * * * *' # every 15 min, all day — release monitor + pre-NFP/CPI poll (fire only when relevant)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run a specific post manually'
        required: true
        default: 'educational'
        type: choice
        options:
          - educational
          - marketbrief
          - calendarpreview
          - newsrelease
          - weeklypoll
          - preeventpoll
          - weeklydigest

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Determine which post to run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            echo "mode=calendarpreview" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 8 * * *" ]; then
            echo "mode=educational" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then
            echo "mode=marketbrief" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 1" ]; then
            echo "mode=weeklypoll" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 15 * * 5" ]; then
            echo "mode=weeklydigest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "*/15 * * * *" ]; then
            echo "mode=newsrelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Run post script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            educational)     node src/postEducational.js ;;
            marketbrief)     node src/postMarketBrief.js ;;
            calendarpreview) node src/postNewsAlert.js ;;
            weeklypoll)      node src/postWeeklyPoll.js ;;
            weeklydigest)    node src/postWeeklyDigest.js ;;
            preeventpoll)    node src/postPreEventPoll.js ;;
            newsrelease)
              node src/postNewsRelease.js
              node src/postPreEventPoll.js
              ;;
            *) echo "Unknown mode" && exit 1 ;;
          esac
