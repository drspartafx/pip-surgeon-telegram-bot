name: Pip Surgeon Telegram Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run a specific post manually'
        required: true
        default: 'educational'
        type: choice
        options:
          - educational
          - marketbrief
          - calendarpreview
          - newsrelease
          - weeklypoll
          - preeventpoll
          - weeklydigest

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Determine which post to run
        id: mode
        run: echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"

      - name: Run post script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            educational)     node src/postEducational.js ;;
            marketbrief)     node src/postMarketBrief.js ;;
            calendarpreview) node src/postNewsAlert.js ;;
            weeklypoll)      node src/postWeeklyPoll.js ;;
            weeklydigest)    node src/postWeeklyDigest.js ;;
            preeventpoll)    node src/postPreEventPoll.js ;;
            newsrelease)
              node src/postNewsRelease.js
              node src/postPreEventPoll.js
              ;;
            *) echo "Unknown mode" && exit 1 ;;
          esac
